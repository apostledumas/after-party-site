<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The After Party | share card (1200x630)</title>
<!-- Source for public/og.png. Render: ./og/render.sh  (headless Chrome, 1200x630, scale 1).
     Evergreen on purpose: no dates, so the card never goes stale after Oct 31. Built to read at thumbnail size
     (iMessage / Instagram DM / X cards shrink it to ~300px wide): one headline, one URL, one face. -->
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;800&family=Caveat+Brush&family=Permanent+Marker&family=Anton&display=swap" rel="stylesheet">
<style>
  :root { --ink:#121110; --paper:#f6f2ea; --red:#e5413d; --pink:#ff9fcf; --butter:#ffe27a;
          --sans:"Inter Tight",system-ui,sans-serif; --script:"Caveat Brush",cursive; --marker:"Permanent Marker",cursive; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--ink); }
  body { position: relative; font-family: var(--sans); color: var(--paper); isolation: isolate; }
  img { display: block; }
  body::before { content: ""; position: absolute; inset: 0; z-index: -1; background: url(../public/assets/v2/paper.jpg) 0 0 / 640px; opacity: .07; }
  .abs { position: absolute; }

  /* stickers: the site's torn wheat-paste scrap as mask + texture */
  .sticker { position: absolute; display: inline-block; padding: 14px 24px 16px; font-family: var(--marker); line-height: 1.02; text-transform: uppercase; color: var(--ink); isolation: isolate; filter: drop-shadow(0 8px 10px rgba(0,0,0,.4)); }
  .sticker::before { content: ""; position: absolute; inset: 0; z-index: -1;
    background: url(../public/assets/v2/scrap-a.png) center / 100% 100% no-repeat, var(--st, var(--pink)); background-blend-mode: multiply;
    -webkit-mask: url(../public/assets/v2/scrap-a.png) center / 100% 100% no-repeat; mask: url(../public/assets/v2/scrap-a.png) center / 100% 100% no-repeat; }
  .sticker.alt::before { background-image: url(../public/assets/v2/scrap-b.png); -webkit-mask-image: url(../public/assets/v2/scrap-b.png); mask-image: url(../public/assets/v2/scrap-b.png); }
  .sticker.butter { --st: var(--butter); }
  .tape { position: absolute; width: 150px; opacity: .93; filter: drop-shadow(0 2px 3px rgba(0,0,0,.3)); z-index: 6; }

  /* left: the words */
  .logo { left: 64px; top: 52px; display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 26px; letter-spacing: -.03em; }
  .logo b { width: 50px; height: 50px; border-radius: 50%; background: var(--red); display: grid; place-items: center; font-size: 20px; color: #fff; transform: rotate(-8deg); }
  .head { left: 60px; top: 150px; font-weight: 800; letter-spacing: -.045em; line-height: .9; font-size: 112px; }
  .head .script { font-family: var(--script); font-weight: 400; letter-spacing: 0; color: var(--pink); font-size: 150px; display: inline-block; transform: rotate(-5deg); margin-left: 6px; }
  .sub { left: 66px; top: 418px; width: 600px; line-height: 1.3; font-size: 27px; font-weight: 700; letter-spacing: -.015em; color: rgba(246,242,234,.82); }
  .sub b { color: var(--paper); }
  .url { left: 60px; top: 516px; display: flex; align-items: center; gap: 14px; height: 76px; padding: 0 30px 0 8px; border-radius: 999px; background: var(--red); color: #fff; font-weight: 800; font-size: 32px; letter-spacing: -.02em; box-shadow: 0 16px 30px -14px rgba(229,65,61,.9); transform: rotate(-2deg); }
  .url i { width: 60px; height: 60px; border-radius: 50%; background: var(--ink); display: grid; place-items: center; }
  .url svg { width: 26px; height: 26px; }

  /* right: Sherman on a red card, butter card behind, breaking out the top */
  .card-butter { left: 728px; top: 150px; width: 400px; height: 440px; border-radius: 34px; background: var(--butter); transform: rotate(-8deg); }
  .card-red { left: 744px; top: 150px; width: 410px; height: 450px; border-radius: 34px; background: var(--red); transform: rotate(4deg); overflow: hidden; isolation: isolate; }
  .card-red::before, .card-butter::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: url(../public/assets/v2/paper.jpg) center / 520px; mix-blend-mode: multiply; opacity: .5; }
  .sherman { left: 690px; top: 46px; width: 500px; filter: grayscale(1) contrast(1.12) brightness(1.04) drop-shadow(0 18px 24px rgba(0,0,0,.45)); z-index: 3;
             -webkit-mask-image: linear-gradient(180deg, #000 74%, transparent 96%); mask-image: linear-gradient(180deg, #000 74%, transparent 96%); }
  /* fade, not clip: a straight crop line read as a cut across the tilted card */
  .crown { left: 865px; top: 4px; width: 128px; z-index: 4; fill: none; stroke: var(--butter); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; transform: rotate(-10deg); }
  .hosted { left: 690px; top: 470px; font-size: 25px; transform: rotate(-6deg); z-index: 7; }
  .yt { right: 40px; top: 44px; font-size: 22px; transform: rotate(5deg); z-index: 7; }
  .popper { left: 560px; top: 30px; width: 200px; z-index: 5; transform: rotate(-12deg); filter: drop-shadow(0 14px 14px rgba(0,0,0,.45)); }
  .sparks { left: 1080px; top: 140px; width: 70px; fill: none; stroke: var(--pink); stroke-width: 4; stroke-linecap: round; z-index: 6; }
  #confetti { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute"><defs><symbol id="i-arrow" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6"/></symbol></defs></svg>

  <div class="abs logo"><b>AP</b>The After Party</div>
  <h1 class="abs head">The After<br>Party is <span class="script">back.</span></h1>
  <p class="abs sub">Live prophetic words with <b>Sherman Dumas</b>.<br>Thursdays, 8 PM CT, on YouTube.</p>
  <div class="abs url"><i><svg><use href="#i-arrow"/></svg></i>theafterparty.tv</div>

  <div class="abs card-butter"></div>
  <div class="abs card-red"></div>
  <img class="tape" src="../public/assets/v2/tape.png" style="left:1060px;top:166px;transform:rotate(38deg)" alt="">
  <img class="abs sherman" src="../public/assets/v2/sherman.png" alt="">
  <svg class="abs crown" viewBox="0 0 120 80"><path d="M10 64 L18 18 L42 46 L60 8 L78 46 L102 18 L110 64 Z"/><path d="M14 74 H106"/></svg>
  <svg class="abs sparks" viewBox="0 0 60 60"><path d="M10 40 L22 28 M28 50 L32 34 M44 46 L50 30"/></svg>
  <img class="abs popper" src="../public/assets/v2/popper-fired.png" alt="">
  <span class="sticker hosted">Hosted by<br>Sherman Dumas</span>
  <span class="sticker butter alt yt">Now on YouTube</span>
  <canvas id="confetti" width="1200" height="630"></canvas>

<script>
  // Frozen confetti from the popper's mouth: Template 50's paper shapes, placed by a seeded random so every
  // render is identical. Kept to the left of Sherman's face and off the headline (rects checked below).
  let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const COLORS = ["#e5413d", "#ff5a4e", "#ff9fcf", "#ffe27a", "#f6f2ea"];
  const ctx = document.getElementById("confetti").getContext("2d");
  const keepOut = [[56, 140, 640, 480], [60, 505, 420, 605], [800, 60, 1060, 330]];   // headline, url pill, face
  for (let i = 0, n = 0; n < 120 && i < 2000; i++) {
    const a = (-150 + rnd() * 120) * Math.PI / 180, d = 40 + Math.pow(rnd(), 0.7) * 520;
    const x = 690 + Math.cos(a) * d, y = 110 + Math.sin(a) * d * 0.75 + rnd() * 60;
    if (x < 20 || x > 1180 || y < 10 || y > 620) continue;
    if (keepOut.some(([l, t, r, b]) => x > l && x < r && y > t && y < b)) continue;
    const w = 7 + rnd() * 9, h = 5 + rnd() * 6;
    ctx.save(); ctx.translate(x, y); ctx.rotate(rnd() * Math.PI * 2); ctx.scale(1, 0.25 + rnd() * 0.75);
    ctx.fillStyle = COLORS[(rnd() * COLORS.length) | 0]; ctx.fillRect(-w / 2, -h / 2, w, h); ctx.restore(); n++;
  }
</script>
</body>
</html>
